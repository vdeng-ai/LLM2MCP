name: CI

on:
  push:
  pull_request:
  workflow_call:

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test
        run: cargo test --locked --all-targets
      - name: Paired evaluation HTTP and MCP regression
        env:
          LLM2MCP_TEST_BINARY: ${{ github.workspace }}/target/debug/llm2mcp${{ runner.os == 'Windows' && '.exe' || '' }}
        run: python -m unittest discover -s scripts/evaluation -v

  quality:
    name: Format and Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
